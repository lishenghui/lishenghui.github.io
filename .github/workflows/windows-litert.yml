name: Windows LiteRT runtime smoke test
on:
  push:
    branches: ['codex/litert-windows-*']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        litert: ['2.2.0', '2.3.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install numpy flatbuffers ai-edge-litert==${{ matrix.litert }}
      - run: python windows-litert-smoke.py
