<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 3 live update test</title><style>body{font:16px system-ui;margin:24px;color:#203040}table{border-collapse:collapse;width:100%}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}.tag{background:#fff1bb;padding:10px}#status{color:#526070}</style><h2>Lab 3 — Live update test</h2><p class="tag">SIMULATION ONLY — these are invented results, not student submissions or measured scores.</p><p id="status">Connecting…</p><table><thead><tr><th>Rank</th><th>Test group</th><th>Score</th><th>Accuracy</th><th>Estimated latency</th></tr></thead><tbody id="rows"></tbody></table><p id="version"></p><script>
const url='https://api.github.com/repos/lishenghui/lishenghui.github.io/contents/teaching/mliot/lab3-demo/results.json';
async function update(){try{const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const payload=await r.json();const d=JSON.parse(atob(payload.content.replace(/\s/g,"")));const target=document.getElementById('rows');target.replaceChildren();d.rows.sort((a,b)=>b.score-a.score).forEach((v,i)=>{const tr=document.createElement('tr');for(const value of [i+1,v.team,v.score.toFixed(4),(v.accuracy*100).toFixed(1)+'%',v.latency_ms+' ms']){const td=document.createElement('td');td.textContent=value;tr.append(td)}target.append(tr)});document.getElementById('version').textContent='Result version: '+d.version+' · '+d.updated;document.getElementById('status').textContent='Connected · checked '+new Date().toLocaleTimeString()+' · refreshes every 10 seconds';}catch(e){document.getElementById('status').textContent='Waiting for results: '+e.message;}}
update();setInterval(update,10000);
</script></html>
